[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apify-hermes-agent-plugin"
version = "0.1.0"
description = "Apify Actor execution tools (discover, start, collect) as a Hermes Agent plugin"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "hermes-agent>=0.15.1",
    "apify-client==3.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[project.entry-points."hermes_agent.plugins"]
apify = "apify_hermes_agent_plugin:register"

[tool.setuptools]
packages = ["apify_hermes_agent_plugin"]
package-dir = { "apify_hermes_agent_plugin" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
