name: apify
version: "0.1.5"
description: 'Scrape social media, Google Maps, search results, and websites with thousands of
  ready-to-run Apify Actors, plus web search and fetch.'
author: Apify
license: MIT
homepage: https://github.com/apify/apify-hermes-agent-plugin
provides_tools:
  - apify_discover
  - apify_start
  - apify_collect
provides_web_providers:
  - apify
provides_hooks: []
requires_env:
  - name: APIFY_API_TOKEN
    description: Apify API token
    url: https://console.apify.com/settings/integrations?utm_source=hermes-agent&utm_medium=integrations
    secret: true
